<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator Biru BVA & EP</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="calculator">
        <div class="display" id="display">0</div>
        <div class="buttons">
            <!-- Baris 1 -->
            <button class="btn fn" onclick="clearDisplay()">AC</button>
            <button class="btn fn" onclick="deleteNumber()">DEL</button>
            <button class="btn fn" onclick="calculateSquareRoot()">&radic;</button>
            <button class="btn op" onclick="appendOperator('^')">^</button>
            
            <!-- Baris 2 -->
            <button class="btn" onclick="appendNumber('7')">7</button>
            <button class="btn" onclick="appendNumber('8')">8</button>
            <button class="btn" onclick="appendNumber('9')">9</button>
            <button class="btn op" onclick="appendOperator('/')">&divide;</button>
            
            <!-- Baris 3 -->
            <button class="btn" onclick="appendNumber('4')">4</button>
            <button class="btn" onclick="appendNumber('5')">5</button>
            <button class="btn" onclick="appendNumber('6')">6</button>
            <button class="btn op" onclick="appendOperator('*')">&times;</button>
            
            <!-- Baris 4 -->
            <button class="btn" onclick="appendNumber('1')">1</button>
            <button class="btn" onclick="appendNumber('2')">2</button>
            <button class="btn" onclick="appendNumber('3')">3</button>
            <button class="btn op" onclick="appendOperator('-')">-</button>
            
            <!-- Baris 5 -->
            <button class="btn" onclick="appendNumber('0')">0</button>
            <button class="btn" onclick="appendNumber('.')">.</button>
            <button class="btn equals" onclick="calculate()">=</button>
            <button class="btn op" onclick="appendOperator('+')">+</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
